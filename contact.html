<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact - Nellie's Laboratories Ltd</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{obsidian:'#0a0a0a',gold:'#d4af37'}}}}</script>
</head>
<body class="bg-obsidian text-white font-sans">

<nav class="p-6 border-b border-gold/20">
  <a href="index.html"><img src="logo.jpg" class="h-12"></a>
</nav>

<section class="max-w-2xl mx-auto py-20 px-6">
  <h1 class="text-4xl text-gold font-bold mb-6">Book a Consultation</h1>
  <p class="text-gray-300 mb-8">Tell us about the product you want to develop</p>
  
  <form class="space-y-4">
    <input type="text" placeholder="Your Name" class="w-full p-3 rounded bg-zinc-900 border border-gold/30">
    <input type="text" placeholder="Company Name" class="w-full p-3 rounded bg-zinc-900 border-gold/30">
    <input type="email" placeholder="Email" class="w-full p-3 rounded bg-zinc-900 border border-gold/30">
    <input type="tel" placeholder="Phone: 08023216673" class="w-full p-3 rounded bg-zinc-900 border border-gold/30">
    <textarea placeholder="What product do you want? Hair, Skin, Toiletries?" rows="4" class="w-full p-3 rounded bg-zinc-900 border border-gold/30"></textarea>
    <button type="submit" class="w-full bg-gradient-to-r from-gold to-yellow-300 text-black font-bold py-3 rounded">Send Message</button>
  </form>

  <div class="mt-12 text-center">
    <p>Or WhatsApp us directly:</p>
    <a href="https://wa.me/2348023216673" class="text-gold text-xl font-bold">08023216673</a>
    <p class="mt-2">Email: nkpm2022@gmail.com</p>
  </div>

  <a href="index.html" class="block mt-8 text-gold">← Back to Home</a>
</section>
</body>
</html>

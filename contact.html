<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact - Nellie's Laboratories Ltd RC</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Sora:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{obsidian:'#0a0a0a',gold:'#d4af37'},fontFamily:{display:['Fraunces','serif'],sans:['Sora','sans-serif']}}}}</script>
</head>
<body class="bg-obsidian text-white font-sans">

<!-- NAV -->
<nav class="p-6 border-b border-gold/20">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <a href="index.html"><img src="logo.jpg" alt="Nellie's Logo" class="h-12 rounded-full"></a>
    <a href="index.html" class="text-gold hover:underline">← Back to Home</a>
  </div>
</nav>

<!-- CONTACT SECTION -->
<section class="max-w-2xl mx-auto py-20 px-6">
  <h1 class="font-display text-4xl md:text-5xl text-gold mb-4">Start Your Product</h1>
  <p class="text-gray-300 mb-8">Tell us what you want to develop. We’ll reply within 24hrs.</p>
  
  <!-- FORM -->
  <form action="https://formsubmit.co/nkpm2022@gmail.com" method="POST" class="space-y-4">
    <input type="hidden" name="_subject" value="New Consultation Request - Nellies Lab">
    <input type="text" name="Name" placeholder="Your Name" required class="w-full p-3 rounded-lg bg-zinc-900 border border-gold/30 focus:border-gold outline-none">
    <input type="text" name="Company" placeholder="Company Name" class="w-full p-3 rounded-lg bg-zinc-900 border-gold/30 focus:border-gold outline-none">
    <input type="email" name="Email" placeholder="Email Address" required class="w-full p-3 rounded-lg bg-zinc-900 border border-gold/30 focus:border-gold outline-none">
    <input type="tel" name="Phone" placeholder="Phone: 08023216673" class="w-full p-3 rounded-lg bg-zinc-900 border border-gold/30 focus:border-gold outline-none">
    <select name="Product Type" class="w-full p-3 rounded-lg bg-zinc-900 border border-gold/30 focus:border-gold outline-none text-gray-400">
      <option>What do you want to develop?</option>
      <option>Hair Care Products</option>
      <option>Skin Care Products</option>
      <option>Toiletries & Personal Care</option>
      <option>Other - Tell us in message</option>
    </select>
    <textarea name="Message" placeholder="Tell us about your product idea..." rows="4" required class="w-full p-3 rounded-lg bg-zinc-900 border border-gold/30 focus:border-gold outline-none"></textarea>
    <button type="submit" class="w-full bg-gradient-to-r from-gold to-yellow-300 text-black font-bold py-4 rounded-lg hover:scale-105 transition">Send Consultation Request</button>
  </form>

  <!-- DIRECT CONTACT -->
  <div class="mt-12 text-center border-t border-gold/20 pt-8">
    <p class="text-gray-400">Or reach us directly:</p>
    <a href="https://wa.me/2348023216673" class="block text-gold text-2xl font-bold mt-2">WhatsApp: 08023216673</a>
    <p class="mt-2">Email: nkpm2022@gmail.com</p>
  </div>
</section>

<!-- FOOTER -->
<footer class="border-t border-gold/20 py-6 text-center text-gray-500 text-sm">
  © 2026 Nellie's Laboratories Ltd RC. All Rights Reserved.
</footer>

</body>
</html>
